# Compile + baseline-toggle check: torch.compile ON, slow_memory OFF, full-size
# dims but few steps. Validates that the chunkwise model compiles and the flat
# baseline path runs on GPU before committing to the long Day-3 runs.
model_args:
  vocab_size: 760
  dim: 768
  v_dim_mult: 1
  head: 8
  ffn_mult: 4
  n_layers: 12
  context_len: 2048
  chunk_size: 256
  slow_memory: false
  slow_gamma_power: 0.25

lr: 3e-4
wd: 0.05
betas: [0.9, 0.98]
grad_norm_clip: 1.0
warm_up_steps: 10
step_limit: 40

batch_size: 8
grad_accum_steps: 1
eval_batch_size: 8
seed: 42

units_dir: /ptmp/yinxu/LinearAttention/units
train_split: dev-clean
valid_split: dev-clean

device: cuda
dtype: bfloat16
compile: true
tf32: true
num_workers: 8

save_interval: null
valid_interval: 30
valid_batches: 5
log_interval: 5
single_batch_test: false
output_path: /ptmp/yinxu/LinearAttention/ckpt
experiment_name: nestedla-smoke-compile
